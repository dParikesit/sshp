name: Release binaries

on:
  push:
    branches: ['**']
  workflow_dispatch:

permissions:
  contents: read

jobs:
  commits:
    if: ${{ !github.event.deleted }}
    runs-on: ubuntu-latest
    outputs:
      builds: ${{ steps.list.outputs.builds }}
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
          persist-credentials: false
      - id: list
        name: Identify each commit in the push
        shell: python
        run: |
          import json, os, re, subprocess, tomllib
          from pathlib import Path
          event = json.loads(Path(os.environ["GITHUB_EVENT_PATH"]).read_text())
          head = os.environ["GITHUB_SHA"]
          before = event.get("before")
          if before and before != "0" * 40:
              commits = subprocess.check_output(
                  ["git", "rev-list", "--reverse", "--topo-order", f"{before}..{head}"], text=True
              ).splitlines()
          else:
              # A new branch has no previous tip. Use its push payload rather
              # than cutting a fresh release for every ancestor of the branch.
              commits = [c["id"] for c in event.get("commits", [])]
          builds = []
          for sha in dict.fromkeys([*commits, head]):
              assert re.fullmatch(r"[0-9a-f]{40}", sha)
              manifest = subprocess.check_output(["git", "show", f"{sha}:Cargo.toml"], text=True)
              version = tomllib.loads(manifest)["package"]["version"]
              builds.append({"sha": sha, "tag": f"v{version}+g{sha}"})
          with open(os.environ["GITHUB_OUTPUT"], "a") as output:
              print("builds=" + json.dumps(builds, separators=(",", ":")), file=output)

  package:
    needs: commits
    strategy:
      fail-fast: false
      matrix:
        include:
          - os: ubuntu-22.04
            target: x86_64-unknown-linux-gnu
          - os: ubuntu-22.04-arm
            target: aarch64-unknown-linux-gnu
          - os: macos-15
            target: aarch64-apple-darwin
          - os: macos-15
            target: x86_64-apple-darwin
    runs-on: ${{ matrix.os }}
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
          persist-credentials: false
      - name: Build the CLI and agent for each revision
        shell: bash
        env:
          BUILDS: ${{ needs.commits.outputs.builds }}
          TARGET: ${{ matrix.target }}
        run: |
          set -euo pipefail
          rustup toolchain install stable --profile minimal --target "$TARGET"
          export CARGO_TARGET_DIR="$RUNNER_TEMP/target"
          while read -r sha; do
            git checkout --quiet --detach "$sha"
            cargo +stable build --locked --release --bins --target "$TARGET"
            out="$RUNNER_TEMP/packages/$sha"
            mkdir -p "$out"
            tar -C "$CARGO_TARGET_DIR/$TARGET/release" \
              -czf "$out/sshp-$TARGET.tar.gz" sshp sshp-agent
          done < <(jq -r '.[].sha' <<< "$BUILDS")
      - uses: actions/upload-artifact@v4
        with:
          name: release-${{ matrix.target }}
          path: ${{ runner.temp }}/packages/
          if-no-files-found: error
          retention-days: 1

  publish:
    needs: [commits, package]
    runs-on: ubuntu-latest
    permissions:
      contents: write
    steps:
      - uses: actions/download-artifact@v4
        with:
          pattern: release-*
          path: packages
          merge-multiple: true
      - name: Publish complete releases
        env:
          GH_TOKEN: ${{ github.token }}
          GH_REPO: ${{ github.repository }}
          DEFAULT_BRANCH: ${{ github.event.repository.default_branch }}
          BUILDS: ${{ needs.commits.outputs.builds }}
        shell: bash
        run: |
          set -euo pipefail
          while read -r sha tag; do
            (
              cd "packages/$sha"
              files=(sshp-{aarch64,x86_64}-apple-darwin.tar.gz sshp-{aarch64,x86_64}-unknown-linux-gnu.tar.gz)
              sha256sum "${files[@]}" > SHA256SUMS
              flags=(--latest=false)
              if [[ "$GITHUB_REF_NAME" != "$DEFAULT_BRANCH" ]]; then
                flags+=(--prerelease)
              elif [[ "$sha" == "$(gh api "repos/$GH_REPO/commits/$DEFAULT_BRANCH" --jq .sha)" ]]; then
                flags=(--latest)
              fi

              # A commit may also arrive via a merge or a workflow retry.
              # Never overwrite an already published build of that commit.
              if state=$(gh release view "$tag" --json isDraft,isPrerelease); then
                if [[ "$(jq -r .isDraft <<< "$state")" == true ]]; then
                  gh release upload "$tag" "${files[@]}" SHA256SUMS --clobber
                  gh release edit "$tag" --draft=false "${flags[@]}"
                elif [[ "$GITHUB_REF_NAME" == "$DEFAULT_BRANCH" ]]; then
                  gh release edit "$tag" --prerelease=false "${flags[@]}"
                fi
              else
                gh release create "$tag" "${files[@]}" SHA256SUMS --target "$sha" \
                  --title "sshp ${tag#v}" --notes "Built from $sha." "${flags[@]}"
              fi
            )
          done < <(jq -r '.[] | [.sha,.tag] | @tsv' <<< "$BUILDS")
